buildscript {
  ext.getExtOrDefault = {name ->
    return rootProject.ext.has(name) ? rootProject.ext.get(name) : project.properties['RNNaverLogins_' + name]
  }

  // Only put the Android/Kotlin Gradle plugins on the buildscript classpath when this
  // library is built on its own. When it is consumed by an app, the app's root
  // buildscript already provides both, and Gradle resolves a shared buildscript
  // classpath to the highest requested version — so declaring versions here would
  // silently force the consuming app's entire build onto our AGP/Kotlin.
  if (project == rootProject) {
    repositories {
      mavenCentral()
      google()
    }

    dependencies {
      classpath "com.android.tools.build:gradle:${project.properties['RNNaverLogins_gradleVersion']}"
      classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:${project.properties['RNNaverLogins_kotlinVersion']}"
    }
  }
}

def isNewArchitectureEnabled() {
  return rootProject.hasProperty("newArchEnabled") && rootProject.getProperty("newArchEnabled") == "true"
}

apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

if (isNewArchitectureEnabled()) {
  apply plugin: "com.facebook.react"
}

def supportsNamespace() {
  def parsed = com.android.Version.ANDROID_GRADLE_PLUGIN_VERSION.tokenize('.')
  def major = parsed[0].toInteger()
  def minor = parsed[1].toInteger()

  // Namespace support was added in 7.3.0
  return (major == 7 && minor >= 3) || major >= 8
}

android {
  if (supportsNamespace()) {
    namespace "com.dooboolab.naverlogin"

    sourceSets {
      main {
        manifest.srcFile "src/main/AndroidManifestNew.xml"
      }
    }
  }

  compileSdk getExtOrDefault('compileSdkVersion').toInteger()

  defaultConfig {
    minSdk getExtOrDefault('minSdkVersion').toInteger()
    targetSdk getExtOrDefault('targetSdkVersion').toInteger()
  }

  buildTypes {
    release {
      minifyEnabled false
    }
  }

  lint {
    disable "GradleCompatible"
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }

  kotlinOptions {
    jvmTarget = "17"
  }
}

repositories {
  mavenCentral()
  google()
}

def kotlin_version = getExtOrDefault("kotlinVersion")

dependencies {
  // For < 0.71, this will be from the local maven repo
  // For > 0.71, this will be replaced by `com.facebook.react:react-android:$version` by react gradle plugin
  //noinspection GradleDynamicVersion
  implementation "com.facebook.react:react-native:+"
  implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
  implementation "com.navercorp.nid:oauth:${getExtOrDefault('naverSdkVersion')}"
}
