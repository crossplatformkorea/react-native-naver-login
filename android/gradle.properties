# The Naver SDK pulls in AndroidX artifacts, and AGP 8 requires this to be set.
# Consuming apps already set it globally; this keeps a standalone library build working.
android.useAndroidX=true

RNNaverLogins_kotlinVersion=2.1.20
RNNaverLogins_minSdkVersion=24
RNNaverLogins_compileSdkVersion=36
RNNaverLogins_targetSdkVersion=36
RNNaverLogins_gradleVersion=8.13.2
# Held at 5.10.0 deliberately: 5.11.x renames the OAuth callback API
# (OAuthLoginCallback -> NidOAuthCallback) and changes NidOAuthErrorCode, which
# requires rewriting RNNaverLoginModule.kt rather than a version bump.
RNNaverLogins_naverSdkVersion=5.10.0
