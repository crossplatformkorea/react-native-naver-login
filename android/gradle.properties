# The Naver SDK pulls in AndroidX artifacts, and AGP 8 requires this to be set.
# Consuming apps already set it globally; this keeps a standalone library build working.
android.useAndroidX=true

RNNaverLogins_kotlinVersion=2.1.20
RNNaverLogins_minSdkVersion=24
RNNaverLogins_compileSdkVersion=36
RNNaverLogins_targetSdkVersion=36
RNNaverLogins_gradleVersion=8.13.2
# Held at 5.10.0 deliberately. Two separate things block 5.11.x (latest: 5.11.2):
#
# 1. Source changes, which are understood and mechanical:
#    - `com.navercorp.nid.oauth.OAuthLoginCallback` becomes
#      `com.navercorp.nid.oauth.util.NidOAuthCallback`; `onError` is gone and
#      `onFailure(httpStatus: Int, message: String)` becomes
#      `onFailure(errorCode: String, errorDesc: String)`.
#    - `NidOAuthErrorCode` moves to `com.navercorp.nid.core.data.errorcode`
#      (its `code` stays a String).
#    - `NaverIdLoginSDK.logout()` becomes `logout(callback): Job`.
#
# 2. A toolchain requirement we cannot impose on consumers yet, which is the
#    actual blocker: oauth 5.11.x ships Kotlin metadata 2.1.0 and drags in
#    kotlin-stdlib 2.1.x, so the *consuming app* must compile with Kotlin >= 2.0.
#    Measured against 5.11.2: Kotlin 2.1.20 and 2.0.21 compile, 1.9.24 fails with
#    "metadata is 2.1.0, expected version is 1.9.0". That would break every
#    consumer on RN <= 0.75, so it needs to ride a major release.
RNNaverLogins_naverSdkVersion=5.10.0
